<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#009246;--red:#CE2B37;--gold:#B8860B;--blue:#1E5AA8;--ink:#2b2723;--sub:#8a837a;--bg:#F7F7F4;--card:#ffffff;--line:#e6e3dc;--irr:#FFF8E6;--radius:20px;--radius-sm:14px;--radius-xs:12px;--shadow:0 6px 20px rgba(0,0,0,.07);--shadow-soft:0 3px 10px rgba(0,0,0,.05)}
html,body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#009246,#CE2B37);color:#fff;padding:14px 20px 18px;border-radius:0 0 26px 26px;box-shadow:0 8px 26px rgba(0,0,0,.18)}
header h1{font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1 .flag{letter-spacing:2px}
header .sub{display:flex;align-items:center;gap:10px;margin-top:8px}
header .sub .logo{height:24px;width:24px;border-radius:10px;object-fit:cover;background:#fff;padding:1px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
header .sub .brand{font-size:16px;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.toprow{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
#search{flex:1;min-width:200px;padding:11px 16px;border:none;border-radius:999px;font-size:14px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#vcount{font-size:12px;opacity:.95;white-space:nowrap}
#idx{display:flex;flex-wrap:wrap;gap:5px;margin:12px 20px 0}
.idxbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;cursor:pointer;font-size:14px;transition:transform .12s ease,background .15s ease,box-shadow .15s ease;box-shadow:var(--shadow-soft)}
.idxbtn:hover{background:var(--gold);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.idxbtn.off{opacity:.3;cursor:default}
.idxbtn.act{background:var(--green);color:#fff;border-color:var(--green)}
.layout{display:grid;grid-template-columns:minmax(330px,400px) minmax(0,1fr);gap:18px;padding:16px 20px 40px;align-items:start;max-width:1720px;margin:0 auto}
.rcol{min-width:0}
.vpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:150px;box-shadow:var(--shadow)}
.vitem{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius-xs);cursor:pointer;border-bottom:1px dashed #f0e9dd;transition:background .15s ease,transform .12s ease}
.vitem:hover{background:#eaf6ee}
.vitem.sel{background:var(--green);color:#fff;border-radius:var(--radius-xs)}
 .vitem.sel .vcn{color:#d8ffe0}
.vitem.sel .tag.irr{background:rgba(255,255,255,.25);color:#fff}
.vinf{font-weight:700;font-size:16px}
.vcn{font-size:13px;color:var(--sub);flex:1}
.tag{font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.tag.reg{background:#e6f4ea;color:#1e7a3c}
.tag.irr{background:var(--irr);color:#b8860b}
.tag.type{background:#eef2fa;color:var(--blue)}
.tag.refl{background:#f3e1e6;color:var(--red)}
.empty{padding:30px;text-align:center;color:var(--sub)}
#detail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-height:400px;box-shadow:var(--shadow)}
#vtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--line)}
#vtitle .big{font-size:32px;font-weight:800;color:var(--green)}
#vtitle .cn{font-size:17px;color:var(--sub)}
.mood{margin-bottom:20px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-soft)}
.mhead{background:var(--mc);color:#fff;padding:11px 16px;font-size:16px}
.tensegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px}
.tense{background:#fdfbf7;border:1px solid #efe7da;border-radius:var(--radius-sm);padding:11px 14px}
.tname{display:flex;flex-direction:column;margin-bottom:7px;border-bottom:1px dashed #e5dccd;padding-bottom:6px}
.tname b{font-size:14.5px}
.tname i{font-size:12px;color:var(--sub);font-style:normal}
.trow{display:flex;gap:10px;padding:4px 0;font-size:16px}
.tper{width:100px;color:var(--sub);font-size:13px;padding-top:2px;flex-shrink:0}
.trow.yo .tform{color:var(--green);font-weight:700}
.impgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;padding:14px}
.impcell{background:#fdfbf7;border:1px solid #efe7da;border-radius:var(--radius-sm);padding:15px;text-align:center}
.impcell .ilab{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.impcell b{font-size:20px;color:var(--blue)}
@media(max-width:920px){
  .layout{grid-template-columns:1fr}
  .vpanel{position:static;max-height:320px}
  #idx{margin:10px 12px 0}
  .layout{padding:12px}
  header h1{font-size:17px}
  .trow{font-size:17px}
  .tname b{font-size:15.5px}
  .tper{width:auto;min-width:92px;font-size:13px}
  .vinf{font-size:16.5px}
  .vcn{font-size:13.5px}
  #vtitle .big{font-size:28px}
}
</style>
</head>

// ===== Motore di coniugazione italiano =====
var PRON=["io","tu","lui/lei","noi","voi","loro"];
var REFL=["mi","ti","si","ci","vi","si"];
var VOWELS="aeiouàèéìòóù";
var END={
'are':{pres:['o','i','a','iamo','ate','ano'],imperf:['avo','avi','ava','avamo','avate','avano'],remoto:['ai','asti','ò','ammo','aste','arono'],subj_pres:['i','i','i','iamo','iate','ino'],subj_imperf:['assi','assi','asse','assimo','aste','assero']},
'ere':{pres:['o','i','e','iamo','ete','ono'],imperf:['evo','evi','eva','evamo','evate','evano'],remoto:['etti','esti','ette','emmo','este','ettero'],subj_pres:['a','a','a','iamo','iate','ano'],subj_imperf:['essi','essi','esse','essimo','este','essero']},
'ire':{pres:['o','i','e','iamo','ite','ono'],imperf:['ivo','ivi','iva','ivamo','ivate','ivano'],remoto:['ii','isti','ì','immo','iste','irono'],subj_pres:['a','a','a','iamo','iate','ano'],subj_imperf:['issi','issi','isse','issimo','iste','issero']}
};
function isArr(x){return Object.prototype.toString.call(x)==='[object Array]';}
function pre(x,f){if(f===undefined||f==='')return f;if(!x)return f;return x+f;}
function r0(s){return s.slice(0,-1);}
// 拼写修正：-care/-gare 前 i/e 加 h；-ciare/-giare/-sciare 前 i 结尾去 i；-iare_t 保留 i
function fixSpell(ch, stem, ending){
if(ch==='care'||ch==='gare'){
if(ending.charAt(0)==='i'||ending.charAt(0)==='e')return stem+'h'+ending;
return stem+ending;
}
if(ch==='ciare'||ch==='giare'||ch==='sciare'){
if(ending.charAt(0)==='i')return stem.slice(0,-1)+ending;
return stem+ending;
}
return stem+ending;
}
function buildPres(spec){
var t=spec.type,ch=spec.ch,stem=spec.stem,out=[];
for(var i=0;i<6;i++){
if(ch==='isc'){
out.push(i<3||i===5 ? stem+['isco','isci','isce','','','iscono'][i] : stem+['','','','iamo','ite',''][i]);
} else if(spec.iare){
if(i<3){
if(ch==='iare_t') out.push(stem+['o','i','a'][i]);                       // 重读 -iare：inviare→invio/invii/invia
else if(i===0) out.push(stem+'o');                                       // 非重读：studiare→studio
else if(i===1) out.push(stem.slice(0,-1)+'i');                           //                 → studi
else out.push(stem+'a');                                                 //                 → studia
} else {
out.push(stem.slice(0,-1)+['iamo','iate','iano'][i-3]);
}
} else {
out.push(fixSpell(ch,stem,END[t].pres[i]));
}
}
return out;
}
function buildSubjPres(spec){
var t=spec.type,ch=spec.ch,stem=spec.stem,out=[];
for(var i=0;i<6;i++){
if(ch==='isc'){
out.push(i<3||i===5 ? stem+['isca','isca','isca','','','iscano'][i] : stem+['','','','iamo','iate',''][i]);
} else if(spec.iare){
if(i<3){
if(ch==='iare_t') out.push(stem+'i');          // 重读：inviare→che io invii / odiare→che io odii / variare→che io varii
else out.push(stem.slice(0,-1)+'i');            // 非重读：studiare→che io studi
} else {
// 3 复数：重读 -iare 保留 i（avviino/inviino/odiino），非重读 -iare 去掉 i（studino/cambino/inizino/varino/ammobilino）
if(i===5) out.push((ch==='iare_t')?stem+'ino':stem.slice(0,-1)+'ino');
else out.push(stem.slice(0,-1)+['iamo','iate','ino'][i-3]);
}
} else {
out.push(fixSpell(ch,stem,END[t].subj_pres[i]));
}
}
return out;
}
function buildImperf(spec){
var t=spec.type,stem=spec.stem;
return END[t].imperf.map(function(e){return stem+e;});
}
function buildRemoto(spec){
var t=spec.type,stem=spec.stem;
return END[t].remoto.map(function(e){return stem+e;});
}
function buildFutCond(spec,which){
var t=spec.type,stem=spec.stem,ch=spec.ch;
var base;
if(t==='ire')base=stem+'ir';
else if(ch==='care'||ch==='gare')base=stem+'her';
else if(ch==='ciare'||ch==='giare'||ch==='sciare')base=stem.slice(0,-1)+'er';
else if(spec.iare)base=(stem.slice(-1)==='i'||/(sc|cc|gg|[cg])$/.test(stem))?stem+'er':stem+'i'+'er';   // -iare 未来/条件式：词干以 c/g/sc/cc/gg 结尾去主题 i（viaggiare→viaggerò / mangiare→mangerò / lasciare→lascerò），其余保留 i（studiare→studierò / raschiare→raschierò）   // 纯 -iare：iniziare(词干inizi)→inizierò / viaggiare→viaggierò / odiare(odi)→odierò / studiare→studierò
else base=stem+'er';
var ends = which==='fut' ? ['ò','ai','à','emo','ete','anno'] : ['ei','esti','ebbe','emmo','este','ebbero'];
return ends.map(function(e){return base+e;});
}
function buildSubjImperf(spec){
var t=spec.type,stem=spec.stem;
return END[t].subj_imperf.map(function(e){return stem+e;});
}
function buildImp(spec,pres,subj){
var t=spec.type,ch=spec.ch,stem=spec.stem;
var tu,lei,noi,voi,loro;
if(ch==='isc'){
tu=stem+'isci'; lei=stem+'isca'; noi=stem+'iamo'; voi=stem+'ite'; loro=stem+'iscano';
} else if(spec.iare){
tu=stem.slice(0,-1)+'ia';
lei = (ch==='iare_t') ? stem.slice(0,-1)+'ii' : stem.slice(0,-1)+'i';   // 重读 invii / 非重读 studi
noi=stem.slice(0,-1)+'iamo'; voi=stem.slice(0,-1)+'iate'; loro=(ch==='iare_t')?stem+'ino':stem.slice(0,-1)+'ino';   // 重读 -iare 保留 i（avviino/inviino），非重读去掉 i（studino/varino）
} else {
// 命令式 tu：仅 -are 用 'a'（parla），-ere/-ire 与虚拟式 tu 同形（credi/finisci）
tu = (t==='are') ? stem+'a' : fixSpell(ch,stem,END[t].pres[1]);
lei=subj[2]; noi=subj[3]; voi=fixSpell(ch,stem,END[t].pres[4]); loro=subj[5];
}
return ['',tu,lei,noi,voi,loro];
}
function buildGerPPRPP(spec){
var t=spec.type,stem=spec.stem,ch=spec.ch;
var ger,pp,ppr;
if(t==='are'){ger=stem+'ando';pp=stem+'ato';ppr=stem+'ante';}
else if(t==='ere'){ger=stem+'endo';pp=stem+'uto';ppr=stem+'ente';}
else {ger=stem+'endo';pp=stem+'ito';ppr=stem+'ente';}
return {ger:ger,pp:pp,ppr:ppr};
}
// 解析基础变位（支持完全模型 + 半不规则部分模型 + 前缀派生）
function buildBase(v){
var refl = v.i.slice(-2)==='si';
var m = v.b ? MODELS[v.b] : null;
// 自反动词 v.i 形如 lavarsi，基数原形存于 v.bi（lavare）。派生动词（v.b 为去前缀基形，如 ac+correre→correre）须用 v.b 作基数，避免前缀叠加成 acaccorro。
var baseInf = refl ? (v.bi || v.i.slice(0,-2)) : (v.b ? v.b : v.i);
// 确定类型与词干：意大利语后缀为 3 字符（-are/-ere/-ire）
var type = baseInf.slice(-3);
var stem = baseInf.slice(0,-3);
var ch = v.ch;
var isIare = baseInf.slice(-4)==='iare' && !(ch==='ciare'||ch==='giare'||ch==='sciare');   // 纯 -iare（studiare/inviare…），排除 -ciare/-giare/-sciare
var spec = {type:type, stem:stem, ch:ch, iare:isIare};
var x = v.x||'';
function fill(field, fn){
var val;
if(m && m[field]!==undefined){ val = m[field]; }
else { val = fn(); }
if(isArr(val)) return val.map(function(s){return pre(x,s);});
return pre(x,val);
}
var pres = fill('pres', function(){return buildPres(spec);});
var imperf = fill('imperf', function(){return buildImperf(spec);});
var remoto = fill('remoto', function(){return buildRemoto(spec);});
var fut = fill('fut', function(){return buildFutCond(spec,'fut');});
var cond = fill('cond', function(){return buildFutCond(spec,'cond');});
var base_subj_pres = (m && m.subj_pres!==undefined) ? m.subj_pres : buildSubjPres(spec);
var subj_pres = fill('subj_pres', function(){return base_subj_pres;});
var subj_imperf = fill('subj_imperf', function(){return buildSubjImperf(spec);});
var gp = buildGerPPRPP(spec);
var ger = pre(x, (m&&m.ger)?m.ger:gp.ger);
var ppr = pre(x, v.ppr ? v.ppr : (m&&m.ppr)?m.ppr:gp.ppr);
var pp = v.pp ? pre(x,v.pp) : pre(x,(m&&m.pp)?m.pp:gp.pp);
// 命令式的 lei/loro 取自 subj_pres；此处传【未前缀化】的 base_subj_pres，
// 由 fill 统一前缀化一次，避免前缀动词（基形模型缺 imp 时）出现双重前缀（acaccorra）。
var imp = fill('imp', function(){return buildImp(spec, pres, base_subj_pres);});
return {pres:pres,imperf:imperf,remoto:remoto,fut:fut,cond:cond,
subj_pres:subj_pres,subj_imperf:subj_imperf,imp:imp,
ger:ger,ppr:ppr,pp:pp,inf:baseInf,aux:v.aux};
}
function buildFull(v){
var refl = v.i.slice(-2)==='si';
var b = buildBase(v);
var aux = refl ? 'e' : b.aux;         // 自反一律 essere
var A = aux==='e' ? ESSERE : AVERE;
var pp = b.pp;
// 复合时态（essere/自反 → 分词性数一致：noi/voi/loro 用复数 -i）
function compound(AUX){
var ppPl = pp.slice(0,-1)+'i';
return AUX.map(function(h,idx){
var p = (aux==='e' && idx>=3) ? ppPl : pp;
return h+' '+p;
});
}
function reflCompound(AUX){
var ppPl = pp.slice(0,-1)+'i';
return AUX.map(function(h,idx){
var p = (idx>=3) ? ppPl : pp;
return REFL[idx]+' '+h+' '+p;
});
}
// 简单时态（自反 → 加反身代词）
function simple(arr){ return refl ? arr.map(function(f,i){return REFL[i]+' '+f;}) : arr; }
var ind_pres = simple(b.pres);
var ind_imperf = simple(b.imperf);
var ind_remoto = simple(b.remoto);
var ind_fut = simple(b.fut);
var ind_cond = simple(b.cond);
var subj_pres = simple(b.subj_pres);
var subj_imperf = simple(b.subj_imperf);
var ind_perf = refl ? reflCompound(A.pres) : compound(A.pres);
var ind_plus = refl ? reflCompound(A.imperf) : compound(A.imperf);
var ind_remoto_ant = refl ? reflCompound(A.remoto) : compound(A.remoto);
var ind_fut_perf = refl ? reflCompound(A.fut) : compound(A.fut);
var subj_perf = refl ? reflCompound(A.subj_pres) : compound(A.subj_pres);
var subj_plus = refl ? reflCompound(A.subj_imperf) : compound(A.subj_imperf);
var cond_perf = refl ? reflCompound(A.cond) : compound(A.cond);
var imp;
if(refl){
var baseImp = b.imp;
imp = ['',
baseImp[1]+'ti',          // lavati
'si '+baseImp[2],         // si lavi
baseImp[3].slice(0,-1)+'ci', // laviamoci
baseImp[4]+'vi',          // lavatevi
'si '+baseImp[5]          // si lavino
];
} else {
imp = b.imp;
}
// 否定命令式 Imperativo negativo
// 非自反：tu = non + 原形；noi/voi = non + 现在时；Lei/Loro = non + 虚拟式现在时
// 自反：tu = non ti + 原形（b.inf 已是去 si 基数）；noi/voi 复用带代词的现在时；Lei/Loro = non si + 虚拟式
var sp2 = b.subj_pres[2], sp5 = b.subj_pres[5];
var simp = simple(b.pres);          // 自反时已带 mi/ti/ci/vi/si 代词
var imp_neg;
if(refl){
imp_neg = ['',
'non ti '+b.inf,      // non ti lavare
'non si '+sp2,        // non si lavi
'non '+simp[3],       // non ci laviamo
'non '+simp[4],       // non vi lavate
'non si '+sp5         // non si lavino
];
} else {
imp_neg = ['',
'non '+b.inf,         // non parlare
'non '+sp2,           // non parli
'non '+simp[3],       // non parliamo
'non '+simp[4],       // non parlate
'non '+sp5            // non parlino
];
}
var inf = refl ? b.inf.slice(0,-1)+'si' : b.inf;   // lavare -> lavarsi（去 e 换 si）
var inf_comp = (refl ? 'essersi' : A.inf) + ' ' + pp;
var ger = refl ? b.ger+'si' : b.ger;                // lavando -> lavandosi（直接加 si）
var ger_comp = (refl ? 'essendosi' : A.ger) + ' ' + pp;
// 过去分词性数一致（m.sg / f.sg / m.pl / f.pl）：意语过去分词阳单恒以 -o 结尾
var ppAgree;
if(pp.charAt(pp.length-1)==='o'){
ppAgree=[pp, pp.slice(0,-1)+'a', pp.slice(0,-1)+'i', pp.slice(0,-1)+'e'];
} else {
ppAgree=[pp,pp,pp,pp];
}
return {
ind_pres:ind_pres, ind_perf:ind_perf, ind_imperf:ind_imperf, ind_plus:ind_plus,
ind_remoto:ind_remoto, ind_remoto_ant:ind_remoto_ant, ind_fut:ind_fut, ind_fut_perf:ind_fut_perf,
subj_pres:subj_pres, subj_perf:subj_perf, subj_imperf:subj_imperf, subj_plus:subj_plus,
cond_pres:ind_cond, cond_perf:cond_perf,
imp:imp, imp_neg:imp_neg,
inf:inf, inf_comp:inf_comp, ger:ger, ger_comp:ger_comp, ppr:b.ppr, pp:pp, pp4:ppAgree,
aux:aux, refl:refl
};
}

<script>

if(!vs.length){listEl.innerHTML='<div class="empty">没有匹配的动词</div>';selEl=null;return;}
var CH=150;
listEl.innerHTML=vs.slice(0,CH).map(itemHtml).join('');
if(vs.length>CH){
var i=CH;
(function step(){
if(i>=vs.length)return;
var end=Math.min(i+CH,vs.length);
var frag=document.createElement('div');
frag.innerHTML=vs.slice(i,end).map(itemHtml).join('');
while(frag.firstChild)listEl.appendChild(frag.firstChild);
i=end;
listTimer=setTimeout(step,1);
})();
}
selEl=listEl.querySelector('.vitem.sel');
}
function tenseLabel(key){
var m={
ind_pres:['陈述式现在时','Presente'],
ind_perf:['现在完成时','Passato prossimo'],
ind_imperf:['过去未完成时','Imperfetto'],
ind_plus:['过去完成时','Trapassato prossimo'],
ind_remoto:['简单过去时','Passato remoto'],
ind_remoto_ant:['先过去时','Trapassato remoto'],
ind_fut:['将来时','Futuro semplice'],
ind_fut_perf:['将来完成时','Futuro anteriore'],
subj_pres:['虚拟式现在时','Congiuntivo presente'],
subj_perf:['虚拟式现在完成时','Congiuntivo passato'],
subj_imperf:['虚拟式过去未完成时','Congiuntivo imperfetto'],
subj_plus:['虚拟式过去完成时','Congiuntivo trapassato'],
cond_pres:['条件式现在时','Condizionale presente'],
cond_perf:['条件式过去时','Condizionale passato'],
imp:['命令式肯定','Imperativo (affermativo)'],
imp_neg:['命令式否定','Imperativo (negativo)']
};
return m[key]||[key,key];
}
function tenseBlock(key,arr){
var lb=tenseLabel(key);
var rows=arr.map(function(f,i){
return '<div class="trow'+(i===0?' yo':'')+'"><span class="tper">'+PRON[i]+'</span><span class="tform">'+f+'</span></div>';
}).join('');
return '<div class="tense"><div class="tname"><b>'+lb[0]+'</b><i>'+lb[1]+'</i></div>'+rows+'</div>';
}
function moodBlock(color,title,keys){
var inner='';
keys.forEach(function(k){inner+=tenseBlock(k,cache[selected.i][k]);});
return '<section class="mood" style="--mc:'+color+'"><h3 class="mhead">'+title+'</h3><div class="tensegrid">'+inner+'</div></section>';
}
function select(inf){
var v=null;
VERBS.forEach(function(x){if(x.i===inf)v=x;});
if(!v)return;
selected=v;
if(!cache[inf])cache[inf]=buildFull(JSON.parse(JSON.stringify(v)));
var c=cache[inf];
titleEl.innerHTML='<span class="big">'+v.i+'</span><span class="cn">'+v.c+'</span>'+
(v.ir?'<span class="tag irr">不规则</span>':'<span class="tag reg">规则</span>')+
'<span class="tag type">-'+v.i.slice(-3)+'</span>'+
(c.refl?'<span class="tag refl">自反</span>':'');
var html='';
html+=moodBlock('#009246','陈述式 Indicativo',['ind_pres','ind_perf','ind_imperf','ind_plus','ind_remoto','ind_remoto_ant','ind_fut','ind_fut_perf']);
html+=moodBlock('#1E5AA8','虚拟式 Congiuntivo',['subj_pres','subj_perf','subj_imperf','subj_plus']);
html+=moodBlock('#CE2B37','条件式 Condizionale',['cond_pres','cond_perf']);
html+=moodBlock('#B8860B','命令式 Imperativo',['imp','imp_neg']);
html+='<section class="mood imp"><h3 class="mhead">非人称形式 Forme impersonali</h3><div class="impgrid">'+
'<div class="impcell"><span class="ilab">原形 Infinito</span><b>'+c.inf+'</b></div>'+
'<div class="impcell"><span class="ilab">复合原形 Infinito composto</span><b>'+c.inf_comp+'</b></div>'+
'<div class="impcell"><span class="ilab">副动词 Gerundio</span><b>'+c.ger+'</b></div>'+
'<div class="impcell"><span class="ilab">复合副动词 Gerundio composto</span><b>'+c.ger_comp+'</b></div>'+
'<div class="impcell"><span class="ilab">现在分词 Participio presente</span><b>'+c.ppr+'</b></div>'+
'<div class="impcell"><span class="ilab">过去分词 Participio passato（阳单/阴单/阳复/阴复）</span><b>'+c.pp4.join(' · ')+'</b></div>'+
'</div></section>';
detailEl.innerHTML=html;
(function alignLabels(){
var ts=detailEl.querySelectorAll('.tper'),max=0;
ts.forEach(function(t){t.style.width='auto';});
ts.forEach(function(t){if(t.scrollWidth>max)max=t.scrollWidth;});
ts.forEach(function(t){t.style.width=max+'px';});
})();
if(selEl)selEl.classList.remove('sel');
selEl=listEl.querySelector('.vitem[data-inf="'+inf+'"]');
if(selEl)selEl.classList.add('sel');
detailEl.scrollTop=0;
}
idxEl.addEventListener('click',function(e){
var b=e.target.closest('.idxbtn');
if(!b||b.classList.contains('off'))return;
curLetter=(curLetter===b.dataset.l)?'':b.dataset.l;
idxEl.querySelectorAll('.idxbtn').forEach(function(x){x.classList.toggle('act',x===b&&!!curLetter);});
renderList();
});
searchEl.addEventListener('input',function(){curQuery=searchEl.value;renderList();});
listEl.addEventListener('click',function(e){
var el=e.target.closest('.vitem');
if(el)select(el.getAttribute('data-inf'));
});
renderIndex();select('essere');renderList();
})();
</script>
</body>
</html>
